version: "3.9"

services:
  bountybrain:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    ports:
      - "8080:8080"
    command: python -m bountybrain.main dashboard

