<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Yellow Black Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px; /* 9:16 TikTok Video format */
            background-color: #0D0D0D;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle geometric shapes */
        .decor-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 4px solid #FFE600;
            border-radius: 50%;
            top: -100px;
            right: -150px;
            opacity: 0.15;
            z-index: 1;
        }

        .decor-line {
            position: absolute;
            width: 800px;
            height: 8px;
            background-color: #FFE600;
            bottom: 300px;
            left: -200px;
            transform: rotate(-45deg);
            opacity: 0.15;
            z-index: 1;
        }

        .decor-dots {
            position: absolute;
            bottom: 150px;
            right: 100px;
            display: grid;
            grid-template-columns: repeat(3, 15px);
            gap: 15px;
            opacity: 0.3;
            z-index: 1;
        }
        .decor-dots div {
            width: 15px;
            height: 15px;
            background-color: #FFE600;
            border-radius: 50%;
        }

        /* Safe Margins container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 150px 100px; /* Safe margins 100px */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        /* Slide badge (top-left) */
        #slide-badge {
            background-color: #FFE600;
            color: #0D0D0D;
            font-weight: 900;
            font-size: 36px;
            padding: 15px 40px;
            border-radius: 50px;
            margin-bottom: auto; /* Pushes content down slightly */
            align-self: flex-start;
            position: absolute;
            top: 200px;
            left: 100px;
        }

        /* Main Text content */
        #slide-content {
            font-size: 75px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -1px;
            text-align: left;
            width: 100%;
            margin-top: -100px; /* Generous negative space adjustment */
        }

        /* Hook specific styling */
        .is-hook #slide-content {
            font-size: 110px;
            font-weight: 900;
            color: var(--accent, #FFE600);
            line-height: 1.1;
            letter-spacing: -3px;
        }

        /* Theme colors mapping for variety across carousels (optional, defaults to yellow) */
        body.theme-0 { --accent: #FFE600; }
        body.theme-1 { --accent: #00FF9D; }
        body.theme-2 { --accent: #FF3366; }
        body.theme-3 { --accent: #00D0FF; }
        body.theme-4 { --accent: #FF9900; }

        /* Dynamic accent applications */
        .decor-circle { border-color: var(--accent); }
        .decor-line { background-color: var(--accent); }
        .decor-dots div { background-color: var(--accent); }
        #slide-badge { background-color: var(--accent); }
        .is-hook #slide-content { color: var(--accent); }

    </style>
</head>
<body class="theme-0">
    <!-- Decor -->
    <div class="decor-circle"></div>
    <div class="decor-line"></div>
    <div class="decor-dots">
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
        <div></div><div></div><div></div>
    </div>

    <!-- Content -->
    <div class="container">
        <div id="slide-badge">1/7</div>
        <div id="slide-content">TESTO DI ESEMPIO</div>
    </div>

    <script>
        function setSlideData(testo, current, total, themeIndex = 0, bgUrl = '') {
            return new Promise((resolve) => {
                document.getElementById('slide-content').innerText = testo;
                document.getElementById('slide-badge').innerText = `${current}/${total}`;
                
                document.body.className = `theme-${themeIndex}`;
                
                if (current === 1) {
                    document.body.classList.add('is-hook');
                } else {
                    document.body.classList.remove('is-hook');
                }
                
                if (bgUrl) {
                    const img = new Image();
                    img.onload = () => {
                        document.body.style.backgroundImage = `url('${bgUrl}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        if (!document.getElementById('bg-overlay')) {
                            const overlay = document.createElement('div');
                            overlay.id = 'bg-overlay';
                            overlay.style.position = 'absolute';
                            overlay.style.top = '0';
                            overlay.style.left = '0';
                            overlay.style.width = '100%';
                            overlay.style.height = '100%';
                            overlay.style.backgroundColor = 'rgba(0,0,0,0.7)';
                            overlay.style.zIndex = '0';
                            document.body.insertBefore(overlay, document.body.firstChild);
                        }
                        resolve();
                    };
                    img.onerror = resolve;
                    img.src = bgUrl;
                } else {
                    resolve();
                }
            });
        }
    </script>
</body>
</html>
