<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Ebook Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px; /* 9:16 TikTok / Reels format */
            background-color: #FAFAF7;
            color: #1A1A1A;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* === Warm textured background === */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 800px 600px at 80% 10%, rgba(212, 168, 83, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 600px 800px at 20% 90%, rgba(212, 168, 83, 0.08) 0%, transparent 60%);
            z-index: 0;
        }

        /* === Top accent bar === */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #D4A853, #F0C97A, #D4A853);
            z-index: 10;
        }

        /* === Bottom accent bar === */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #D4A853, #F0C97A, #D4A853);
            z-index: 10;
        }

        /* === Slide number (top right) === */
        #slide-badge {
            position: absolute;
            top: 60px;
            right: 90px;
            font-family: 'Inter', sans-serif;
            font-size: 26px;
            font-weight: 500;
            color: #D4A853;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* =============================================
           HERO SLIDE (slide 1) — is-hero class
        ============================================= */

        /* Cover image placeholder */
        .hero-cover {
            display: none;
            width: 420px;
            height: 560px;
            background: linear-gradient(145deg, #f5f0e8, #ede4d0);
            border-radius: 20px;
            border: 3px solid rgba(212, 168, 83, 0.4);
            box-shadow: 0 30px 80px rgba(0,0,0,0.15), 0 10px 30px rgba(212,168,83,0.2);
            position: relative;
            overflow: hidden;
            margin-bottom: 70px;
        }

        .hero-cover::after {
            content: '📖';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            opacity: 0.3;
        }

        .is-hero .hero-cover {
            display: block;
        }

        /* BESTSELLER badge */
        .badge-bestseller {
            display: none;
            background: linear-gradient(135deg, #D4A853, #F0C97A);
            color: #1A1A1A;
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 42px;
            border-radius: 50px;
            margin-bottom: 50px;
        }

        .is-hero .badge-bestseller {
            display: inline-block;
        }

        /* Hero title */
        .is-hero #slide-content {
            font-family: 'Playfair Display', serif;
            font-size: 82px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            color: #1A1A1A;
            text-align: center;
            margin-bottom: 36px;
        }

        /* Subtitle */
        #slide-subtitle {
            display: none;
            font-family: 'Inter', sans-serif;
            font-size: 34px;
            font-weight: 400;
            color: #6B6B6B;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 70px;
            max-width: 780px;
        }

        .is-hero #slide-subtitle {
            display: block;
        }

        /* CTA Button */
        .cta-button {
            display: none;
            background: linear-gradient(135deg, #D4A853, #c49644);
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 38px;
            font-weight: 700;
            padding: 28px 80px;
            border-radius: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 40px rgba(212, 168, 83, 0.4);
        }

        .is-hero .cta-button {
            display: block;
        }

        /* =============================================
           BENEFIT SLIDES (slide 2+)
        ============================================= */

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 160px 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .is-hero .container {
            align-items: center;
        }

        /* Section label above content */
        .section-label {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #D4A853;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
            display: none;
        }

        .is-benefit .section-label {
            display: block;
        }

        /* Gold accent line */
        .gold-line {
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #D4A853, #F0C97A);
            border-radius: 2px;
            margin-bottom: 60px;
        }

        .is-hero .gold-line {
            display: none;
        }

        /* Benefit card */
        .benefit-card {
            background: #FFFFFF;
            border: 1px solid rgba(212, 168, 83, 0.25);
            border-radius: 24px;
            padding: 65px 70px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }

        .is-hero .benefit-card {
            display: none;
        }

        /* Checkmark */
        .checkmark {
            font-size: 56px;
            margin-bottom: 36px;
            display: block;
            color: #D4A853;
            line-height: 1;
        }

        /* Benefit text */
        #slide-content {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.3;
            color: #1A1A1A;
        }

        /* Body copy under benefit text */
        #slide-body {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 400;
            color: #6B6B6B;
            line-height: 1.6;
            margin-top: 28px;
            display: none;
        }

    </style>
</head>
<body class="theme-0">

    <!-- Accent bars -->
    <div class="top-bar"></div>
    <div class="bottom-bar"></div>

    <!-- Slide number -->
    <div id="slide-badge">01 / 07</div>

    <!-- Content -->
    <div class="container">

        <!-- HERO elements (visible only on slide 1) -->
        <div class="hero-cover"></div>
        <div class="badge-bestseller">BESTSELLER</div>

        <!-- Gold line (visible on benefit slides) -->
        <div class="gold-line"></div>

        <!-- Section label (benefit slides) -->
        <div class="section-label">Cosa Imparerai</div>

        <!-- Benefit card (benefit slides) -->
        <div class="benefit-card">
            <span class="checkmark">✓</span>
            <div id="slide-content">TESTO DI ESEMPIO</div>
            <div id="slide-body"></div>
        </div>

        <!-- Hero text (visible on slide 1, outside card) -->
        <div id="slide-subtitle">Il metodo che cambia tutto</div>

        <!-- CTA -->
        <div class="cta-button">🔗 Link in Bio</div>

    </div>

    <script>
        function setSlideData(testo, current, total, themeIndex = 0, bgUrl = '') {
            return new Promise((resolve) => {
                document.getElementById('slide-content').innerText = testo;

                // Format badge as zero-padded numbers
                const pad = (n) => String(n).padStart(2, '0');
                document.getElementById('slide-badge').innerText = `${pad(current)} / ${pad(total)}`;

                // Manage slide type classes
                document.body.classList.remove('is-hero', 'is-benefit');
                if (current === 1) {
                    document.body.classList.add('is-hero');
                    // Hero subtitle defaults to generic text; can be overridden via JSON if extended
                    const subtitleEl = document.getElementById('slide-subtitle');
                    if (subtitleEl) subtitleEl.innerText = 'Il metodo che cambia tutto';
                } else {
                    document.body.classList.add('is-benefit');
                }

                // Background image (warm overlay for promo slides)
                if (bgUrl && current === 1) {
                    const img = new Image();
                    img.onload = () => {
                        document.body.style.backgroundImage = `url('${bgUrl}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        if (!document.getElementById('bg-overlay')) {
                            const overlay = document.createElement('div');
                            overlay.id = 'bg-overlay';
                            overlay.style.cssText = [
                                'position: absolute',
                                'top: 0',
                                'left: 0',
                                'width: 100%',
                                'height: 100%',
                                'background: rgba(250, 250, 247, 0.88)',
                                'z-index: 1'
                            ].join('; ');
                            document.body.insertBefore(overlay, document.body.firstChild);
                        }
                        resolve();
                    };
                    img.onerror = resolve;
                    img.src = bgUrl;
                } else {
                    resolve();
                }
            });
        }
    </script>
</body>
</html>
