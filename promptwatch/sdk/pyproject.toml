[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwatch"
version = "0.1.0"
description = "LLM cost tracking and observability — 2 lines of code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "wrapt>=1.16.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]

[project.urls]
Homepage = "https://promptwatch.io"
Documentation = "https://docs.promptwatch.io"
Repository = "https://github.com/promptwatch/promptwatch-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptwatch*"]
